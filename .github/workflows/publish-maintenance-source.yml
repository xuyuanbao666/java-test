name: Publish verified Java maintenance source
on:
  push:
    branches: [release/maintenance-20261127]
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFIED_HEAD: 3ff40ac810083780d4fcc7ec6f993794cf67c139
      TAG: v1.0.0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_HEAD }}
          fetch-depth: 0
      - name: Confirm previous successful compilation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_HEAD"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/45893261093" --jq '[.head_sha,.conclusion] | @tsv' | grep -Fx "$VERIFIED_HEAD"$'\t'success
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then echo "Existing tag; refusing overwrite"; exit 1; fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Existing release; refusing overwrite"; exit 1; fi
      - name: Archive exact tested source and verify checksum
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=java-test/ -o dist/java-test-v1.0.0-source.zip "$VERIFIED_HEAD"
          unzip -t dist/java-test-v1.0.0-source.zip
          (cd dist && sha256sum java-test-v1.0.0-source.zip > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish source-only release
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$VERIFIED_HEAD" --title "Java 学习练习 v1.0.0" --notes "源码学习版：修复 Java 类名冲突及输入处理问题。JDK 17 全部源码编译通过（Actions 45893261093）。此版本提供已验证提交的源码 ZIP 与 SHA-256；不包含可执行安装包。"
